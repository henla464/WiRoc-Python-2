openapi: "3.0.0"
info:
  description: "This is the WiRoc API"
  version: "1.0.0"
  title: "WiRoc"
  contact:
    email: "laselase@gmail.com"
servers:
  - url: /api
tags:
  - name: "Radio"
    description: "LORA Radio settings"
  - name: "SIRAP"
    description: "SIRAP tcp/ip settings"
  - name: "ROC"
    description: "Radio Online Control settings"
  - name: "Status"
    description: ""
  - name: "Database"
    description: ""
  - name: "Public web server"
    description: ""
  - name: "SportIdent"
    description: ""
  - name: "Debug"
    description: ""
  - name: "Network"
    description: "Connect to Wifi and IP options"
  - name: "HAM"
    description: "Amateur radio settings"
  - name: "Power"
    description: "Power management"
  - name: "Device"
    description: "Device information"
  - name: "Logging"
    description: "Logging settings"
  - name: "Bluetooth"
    description: "Classic Bluetooth settings"
  - name: "BLE"
    description: "Bluetooth Low Energy settings"
paths:
  /lora/enabled/:
    get:
      tags:
        - "Radio"
      summary: "Get if LORA radio is enabled"
      operationId: "getLoraEnabled"
      responses:
        "200":
          description: "0/1 depending on if LORA is enabled or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/enabled/{enabled}/:
    get:
      tags:
        - "Radio"
      summary: "Enable/Disable LORA radio"
      operationId: "setLoraEnabled"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/channel/:
    get:
      tags:
        - "Radio"
      summary: "Get the channel used"
      operationId: "getChannel"
      responses:
        "200":
          description: "The channel used"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelObj"
  /lora/channel/{channel}:
    get:
      tags:
        - "Radio"
      summary: "Set the channel"
      operationId: "setChannel"
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelObj"
  /lora/lorarange/:
    get:
      tags:
        - "Radio"
      summary: "Get the Lora Range"
      operationId: "getLoraRange"
      responses:
        "200":
          description: "The range used"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoraRangeObj"
  /lora/lorarange/{lorarange}:
    get:
      tags:
        - "Radio"
      summary: "Set the Lora Range"
      operationId: "setLoraRange"
      parameters:
        - name: lorarange
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LoraRange"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoraRangeObj"
  /lora/acknowledgementrequested/:
    get:
      tags:
        - "Radio"
      summary: "Get if acknowledgemnt should be requested when sending message over the LORA radio"
      operationId: "getAcknowledgementRequested"
      responses:
        "200":
          description: "0/1 depending on if acknowledgement should be requested"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/acknowledgementrequested/{ackreq}:
    get:
      tags:
        - "Radio"
      summary: "Set if acknowledgemnt should be requested when sending message over the lora radio"
      operationId: "setAcknowledgementRequested"
      parameters:
        - name: ackreq
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/listenonly/:
    get:
      tags:
        - "Radio"
      summary: "Get if this WiRoc should only listen to LORA message and not send ack (even when requested)"
      operationId: "getLoraListenOnly"
      responses:
        "200":
          description: "0/1, 1 if it should only listen"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/listenonly/{listenonly}:
    get:
      tags:
        - "Radio"
      summary: "Set if this WiRoc should only listen to LORA message and not send ack (even when requested)"
      operationId: "setLoraListenOnly"
      parameters:
        - name: listenonly
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/power/:
    get:
      tags:
        - "Radio"
      summary: "Get lora radio power in dBm"
      operationId: "getPower"
      responses:
        "200":
          description: "The lora radio power in dBm"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerObj"
  /lora/power/{power}:
    get:
      tags:
        - "Radio"
      summary: "Set the lora radio power in dBm"
      operationId: "setPower"
      parameters:
        - name: power
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Power"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerObj"
  /power/shutdown/:
    get:
      tags:
        - "Power"
      summary: "Shutdown the system"
      operationId: "shutdown"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /power/restart/:
    get:
      tags:
        - "Power"
      summary: "Restart the system"
      operationId: "restart"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /lora/coderate/:
    get:
      tags:
        - "Radio"
      summary: "Get lora radio code rate"
      operationId: "getCodeRate"
      responses:
        "200":
          description: "The code rate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRateObj"
  /lora/coderate/{coderate}:
    get:
      tags:
        - "Radio"
      summary: "Set the lora radio code rate"
      operationId: "setCodeRate"
      parameters:
        - name: coderate
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CodeRate"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRateObj"
  /lora/drf1268dscompatmode/:
    get:
      tags:
        - "Radio"
      summary: "Get if DRF1268DS compatibility mode is enabled"
      operationId: "getDRF1268DSCompatMode"
      responses:
        "200":
          description: "0/1 depending on if DRF1268DS compat mode is enabled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/drf1268dscompatmode/{enabled}:
    get:
      tags:
        - "Radio"
      summary: "Enable/Disable DRF1268DS compatibility mode"
      operationId: "setDRF1268DSCompatMode"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/rxgainenabled/:
    get:
      tags:
        - "Radio"
      summary: "Get if RxGain is enabled"
      operationId: "GetRxGainEnabled"
      responses:
        "200":
          description: "0/1 depending on if RxGain is enabled or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /lora/rxgainenabled/{rxgainenabled}:
    get:
      tags:
        - "Radio"
      summary: "Enable/Disable RxGain"
      operationId: "setRxGainEnabled"
      parameters:
        - name: rxgainenabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /sirap/enabled/:
    get:
      tags:
        - "SIRAP"
      summary: "Get if sending to SIRAP is enabled"
      operationId: "GetSendToSirapEnabled"
      responses:
        "200":
          description: "0/1 depending on if send to SIRAP is enabled or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /sirap/enabled/{enabled}:
    get:
      tags:
        - "SIRAP"
      summary: "Enable/Disable sending punches to SIRAP"
      operationId: "setSendToSirapEnabled"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /sirap/ip/:
    get:
      tags:
        - "SIRAP"
      summary: "Get the IP address that SIRAP messages are sent to"
      operationId: "getSendToSirapIP"
      responses:
        "200":
          description: "The IP address that SIRAP messages are sent to"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPAddressObj"
  /sirap/ip/{ip}:
    get:
      tags:
        - "SIRAP"
      summary: "Set the IP address to send SIRAP messages to"
      operationId: "setSendToSirapIP"
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/IPAddress"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPAddressObj"
  /sirap/ipport/:
    get:
      tags:
        - "SIRAP"
      summary: "Get the TCP/IP port that SIRAP messages are sent to"
      operationId: "getSendToSirapIPPort"
      responses:
        "200":
          description: "SIRAP TCP/IP Port"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyIntObj"
  /sirap/ipport/{port}:
    get:
      tags:
        - "SIRAP"
      summary: "Set the TCP/IP port to send SIRAP messages to"
      operationId: "setSendToSirapIPPort"
      parameters:
        - name: port
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Property"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyIntObj"
  /roc/enabled/:
    get:
      tags:
        - "ROC"
      summary: "Get if sending punches to ROC is enabled"
      operationId: "getRocEnabled"
      responses:
        "200":
          description: "0/1 depending on if send to ROC is enabled or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /roc/enabled/{enabled}:
    get:
      tags:
        - "ROC"
      summary: "Enable/Disable sending punches to ROC server"
      operationId: "setRocEnabled"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /status/:
    get:
      tags:
        - "Status"
      summary: "Get the status, with enabled input and output adapters and transformations"
      operationId: "getStatus"
      responses:
        "200":
          description: "JSON string with data about the inner status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /settings/:
    get:
      tags:
        - "Status"
      summary: "Get all settings"
      operationId: "getSettings"
      responses:
        "200":
          description: "JSON with all settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /settings/{key}/{value}:
    get:
      tags:
        - "Status"
      summary: "Add or change a setting"
      operationId: "setSetting2"
      parameters:
        - name: key
          description: "The settings key name"
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Property"
        - name: value
          description: "The settings value"
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Property"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /errorcodes/:
    get:
      tags:
        - "Status"
      summary: "Get the error codes"
      operationId: "getErrorCodes"
      responses:
        "200":
          description: "The error codes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /device/name/:
    get:
      tags:
        - "Device"
      summary: "Get the device name"
      operationId: "getWiRocDeviceName2"
      responses:
        "200":
          description: "The device name"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /device/name/{devicename}:
    get:
      tags:
        - "Device"
      summary: "Set the device name"
      operationId: "setWiRocDeviceName2"
      parameters:
        - name: devicename
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Property"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /lora/mode/:
    get:
      tags:
        - "Radio"
      summary: "Get the lora mode"
      operationId: "getLoraMode"
      responses:
        "200":
          description: "The lora mode (RECEIVER, REPEATER, SENDER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /lora/mode/{loramode}:
    get:
      tags:
        - "Radio"
      summary: "Set the Lora mode (RECEIVER, REPEATER, SENDER)"
      operationId: "setLoraMode"
      parameters:
        - name: loramode
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Property"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /lora/module/:
    get:
      tags:
        - "Radio"
      summary: "Get the LORA radio module type"
      operationId: "getLoraModule"
      responses:
        "200":
          description: "The LORA radio module name (e.g. DRF1268DS, RAK3172)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /srr/enabled/:
    get:
      tags:
        - "SRR"
      summary: "Get if SRR receiver is enabled"
      operationId: "GetSRREnabled"
      responses:
        "200":
          description: "0/1 depending on if SRR receiver is enabled or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/enabled/{enabled}:
    get:
      tags:
        - "SRR"
      summary: "Enable/Disable the SRR receiver"
      operationId: "setSRREnabled"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/mode:
    get:
      tags:
        - "SRR"
      summary: "Get the mode of the SRR radio"
      operationId: "getSRRMode"
      responses:
        "200":
          description: "The SRR mode (RECEIVE, SEND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /srr/mode/{mode}:
    get:
      tags:
        - "SRR"
      summary: "Set the SRR mode (RECEIVE, SEND)"
      operationId: "setSRRMode"
      parameters:
        - name: srrmode
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Property"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /srr/redchannellistenonly/:
    get:
      tags:
        - "SRR"
      summary: "Get if SRR receiver is only listening without acknowledgeing messages on red channel"
      operationId: "getSRRRedChannelListenOnly"
      responses:
        "200":
          description: "0/1 depending on if SRR receiver is only listening or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/redchannellistenonly/{enabled}:
    get:
      tags:
        - "SRR"
      summary: "Enable/Disable the SRR receiver listen only mode on red channel"
      operationId: "setSRRRedChannelListenOnly"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/bluechannellistenonly/:
    get:
      tags:
        - "SRR"
      summary: "Get if SRR receiver is only listening without acknowledgeing messages on blue channel"
      operationId: "getSRRBlueChannelListenOnly"
      responses:
        "200":
          description: "0/1 depending on if SRR receiver is only listening or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/bluechannellistenonly/{enabled}:
    get:
      tags:
        - "SRR"
      summary: "Enable/Disable the SRR receiver listen only mode on blue channel"
      operationId: "setSRRBlueChannelListenOnly"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/redchannel/:
    get:
      tags:
        - "SRR"
      summary: "Get if the red channel of the SRR receiver is enabled"
      operationId: "GetSRRRedChannel"
      responses:
        "200":
          description: "0/1 depending on if SRR receiver is only listening or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/redchannel/{enabled}:
    get:
      tags:
        - "SRR"
      summary: "Enable/Disable the red channel of the SRR receiver"
      operationId: "setSRRRedChannel"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/bluechannel/:
    get:
      tags:
        - "SRR"
      summary: "Get if the blue channel of the SRR receiver is enabled"
      operationId: "GetSRRBlueChannel"
      responses:
        "200":
          description: "0/1 depending on if SRR receiver is only listening or not"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/bluechannel/{enabled}:
    get:
      tags:
        - "SRR"
      summary: "Enable/Disable the blue channel of the SRR receiver"
      operationId: "setSRRBlueChannel"
      parameters:
        - name: enabled
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TrueFalse"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /srr/hardwarefeatures/:
    get:
      tags:
        - "SRR"
      summary: "Get the hardware features byte of the connected SRR device"
      operationId: "getSRRHardwareFeatures"
      responses:
        "200":
          description: "Integer representing the hardware features bitmask of the SRR device"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /srr/hassendmode/:
    get:
      tags:
        - "SRR"
      summary: "Get if the connected SRR device has send mode capability"
      operationId: "getSRRHasSendMode"
      responses:
        "200":
          description: "0/1 depending on if SRR device supports send mode"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /hashw/srr/:
    get:
      tags:
        - "Status"
      summary: "Get if the hardware supports an SRR radio"
      operationId: "getHasHWSRR"
      responses:
        "200":
          description: "0/1 depending on if SRR radio hardware support is available"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /hashw/rtc/:
    get:
      tags:
        - "Status"
      summary: "Get if the hardware supports an RTC chip"
      operationId: "getHasHWRTC"
      responses:
        "200":
          description: "0/1 depending on if RTC hardware is available"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrueFalseObj"
  /punches/:
    get:
      tags:
        - "Punches"
      summary: "Get new punches (sendtoblenoenabled must be enabled)"
      operationId: "getPunches"
      responses:
        "200":
          description: "JSON with the new punches"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /deletepunches/:
    get:
      tags:
        - "Punches"
      summary: "Delete all punches in the database"
      operationId: "deletePunches"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyObj"
  /roc/:
    get:
      tags:
        - "ROC"
      summary: "Get punches in ROC protocol format for MeOS and other orienteering software"
      operationId: "getRocPunches"
      parameters:
        - name: lastId
          in: query
          required: false
          schema:
            type: integer
          description: "Last imported punch sequence ID. Returns punches with higher IDs."
        - name: unitId
          in: query
          required: false
          schema:
            type: string
          description: "Filter by unit id / event id (not used in this implementation)"
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: "Race date (YYYY-MM-DD)"
        - name: time
          in: query
          required: false
          schema:
            type: string
          description: "from time"
      responses:
        "200":
          description: "Semicolon-delimited punch lines: Seq;UnitId;SICardNumber;YYYY-MM-DD HH:MM:SS"
          content:
            text/plain:
